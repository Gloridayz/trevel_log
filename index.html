const OWNER_COLORS = ['#a8412d', '#a1793a', '#5c6f5a', '#3a6ea1', '#7a4a91', '#ba7a2a'];
function ownerColor(name){
  let hash = 0;
  const s = name || '';
  for(let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return OWNER_COLORS[hash % OWNER_COLORS.length];
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function escapeAttr(s){ return (s==null?'':s).replace(/"/g,'&quot;'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function groupBy(list, key){
  const groups = [];
  list.forEach(item => {
    let g = groups.find(g => g[0] === item[key]);
    if(!g){ g = [item[key], []]; groups.push(g); }
    g[1].push(item);
  });
  return groups;
}

function buildMapLink(text){
  if(/^https?:\/\//i.test(text)) return text;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(text);

/* ===== 사진 압축/업로드 공통 ===== */

function compressForPreview(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 300;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function compressForUpload(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1400;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.75);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const binary = atob(base64);
  const array = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) array[i] = binary.charCodeAt(i);
  return new Blob([array], { type: mime });
}

async function uploadPhotoBlob(blob, idPrefix){
  const path = `${idPrefix}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: blob.type || 'image/jpeg' });
  if(error) throw error;
  const { data } = sb.storage.from('photos').getPublicUrl(path);
  return data.publicUrl;
}

/* ===== 데이터 로드 ===== */

async function loadTripCategories(){
  try{
    const { data, error } = await sb.from('trip_categories').select('*').order('sort_order', { ascending:true }).order('created_at', { ascending:true });
    if(error) throw error;
    state.tripCategories = data;
    render();
  }catch(err){ alert('불러오기 실패: ' + err.message); }
}

async function loadCategoryData(){
  const id = state.selectedCategoryId;
  try{
    const [e, w, x, c, ei] = await Promise.all([
      sb.from('entries').select('*').eq('trip_category_id', id).order('created_at', { ascending:false }),
      sb.from('wishlist').select('*').eq('trip_category_id', id).order('created_at', { ascending:false }),
      sb.from('expenses').select('*').eq('trip_category_id', id).order('date', { ascending:false }),
      sb.from('checklist_items').select('*').eq('trip_category_id', id).order('created_at', { ascending:true }),
      sb.from('expense_items').select('*').eq('trip_category_id', id).order('created_at', { ascending:true })
    ]);
    if(e.error) throw e.error;
    if(w.error) throw w.error;
    if(x.error) throw x.error;
    if(c.error) throw c.error;
    if(ei.error) throw ei.error;
    state.entries = e.data.map(d => ({...d, createdAt: d.created_at, mapLink: d.map_link}));
    state.wishlist = w.data;
    state.expenses = x.data;
    state.checklist = c.data;
    state.expenseItems = ei.data;
    state.activeTab = TAB_LIST[0].key;
    render();
  }catch(err){ alert('불러오기 실패: ' + err.message); }
}

}

async function handleAddTripCategory(e){
  e.preventDefault();
  const input = document.getElementById('catNameInput');
  const name = input.value.trim();
  if(!name) return;
  const currency = document.getElementById('catCurrencyInput').value.trim().toUpperCase() || 'KRW';
  const id = 'tc' + Date.now();
  try{
    const { error } = await sb.from('trip_categories').insert([{ id, name, default_currency: currency }]);
    if(error) throw error;
    e.target.reset();
    await loadTripCategories();
  }catch(err){ alert('추가 실패: ' + err.message); }
}

async function renameTripCategory(id){
  const cat = state.tripCategories.find(c => c.id === id);
  const name = prompt('새 이름을 입력하세요', cat ? cat.name : '');
  if(!name || !name.trim()) return;
  try{
    const { error } = await sb.from('trip_categories').update({ name: name.trim() }).eq('id', id);
    if(error) throw error;
    await loadTripCategories();
  }catch(err){ alert('이름변경 실패: ' + err.message); }
}

async function changeTripCategoryCurrency(id){
  const cat = state.tripCategories.find(c => c.id === id);
  const currency = prompt('기본 통화를 입력하세요 (예: KRW, USD, JPY, TWD)', cat ? (cat.default_currency || 'KRW') : 'KRW');
  if(!currency || !currency.trim()) return;
  try{
    const { error } = await sb.from('trip_categories').update({ default_currency: currency.trim().toUpperCase() }).eq('id', id);
    if(error) throw error;
    await loadTripCategories();
  }catch(err){ alert('통화 변경 실패: ' + err.message); }
}

async function deleteTripCategory(id){
  if(!confirm('이 카테고리를 삭제할까요? 안에 기록/위시리스트/경비/준비물이 있으면 삭제되지 않습니다.')) return;
  try{
    const { error } = await sb.from('trip_categories').delete().eq('id', id);
    if(error) throw error;
    await loadTripCategories();

    if(err.code === '23503'){
      alert('이 카테고리 안에 데이터가 있어 삭제할 수 없습니다. 먼저 안의 기록/위시리스트/경비/준비물을 모두 지워주세요.');

function renderEntriesTab(){
  const content = document.getElementById('tabContent');

async function handlePhotoPreview(e){
  const files = Array.from(e.target.files);
  for(const file of files){
    pendingFiles.push(file);
    pendingPreviews.push(await compressForPreview(file));
  }
  renderThumbList();
  e.target.value = '';
}

function renderThumbList(){
  const box = document.getElementById('thumbPreviewList');
  if(!box) return;
  box.innerHTML = pendingPreviews.map((p,i) => `
    <div style="position:relative;">
      <img src="${p}" style="width:70px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--line);">
      <button type="button" onclick="removePendingPhoto(${i})"
        style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--stamp);color:#fff;border:none;font-size:11px;line-height:1;cursor:pointer;">×</button>
    </div>`).join('');
}

function removePendingPhoto(i){
  pendingFiles.splice(i,1);
  pendingPreviews.splice(i,1);
  renderThumbList();
}

async function handleAdd(e){
  e.preventDefault();
  const title = document.getElementById('titleInput').value.trim();
  if(!title) return;
  const id = 'e' + Date.now();
  const rawMap = document.getElementById('mapInput').value.trim();

  const btn = e.target.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = '업로드 중...';

  try{
    const photoUrls = [];
    for(let i=0; i<pendingFiles.length; i++){
      const blob = await compressForUpload(pendingFiles[i]);
      const path = `${id}/${Date.now()}_${i}.jpg`;
      const { error: upErr } = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
      if(upErr) throw upErr;
      const { data } = sb.storage.from('photos').getPublicUrl(path);
      photoUrls.push(data.publicUrl);
    }

    const { error } = await sb.from('entries').insert([{
      id, trip_category_id: state.selectedCategoryId, title,
      map_link: buildMapLink(rawMap || title),
      photos: photoUrls,
      food: document.getElementById('foodInput').value.trim(),
      note: document.getElementById('noteInput').value.trim()
    }]);
    if(error) throw error;

    pendingFiles = []; pendingPreviews = [];
    await reloadEntries();
    document.getElementById('tabContent').innerHTML = entriesFormHTML() + `<div class="empty">저장했습니다. '추억' 탭에서 확인할 수 있어요.</div>`;
    document.getElementById('photoInput').addEventListener('change', handlePhotoPreview);
    document.getElementById('entryForm').addEventListener('submit', handleAdd);
  }catch(err){
    alert('저장 실패: ' + err.message);
    btn.disabled = false; btn.textContent = '저장하기';
  }
}

function isArchived(entry){
  const created = new Date(entry.createdAt);
  const days = (Date.now() - created.getTime()) / 86400000;
  return days > EDIT_WINDOW_DAYS;
}

async function deleteEntry(id){
  if(!confirm('이 기록을 삭제할까요? 되돌릴 수 없습니다.')) return;
  try{
    const { error } = await sb.from('entries').delete().eq('id', id);
    if(error) throw error;
    state.entries = state.entries.filter(e => e.id !== id);
    renderActiveTab();
  }catch(e){ alert('삭제 실패: ' + e.message); }
}

  `;

  if(btn) btn.onclick = exportMemoriesToPDF;

async function exportMemoriesToPDF(){
  const cat = state.tripCategories.find(c => c.id === state.selectedCategoryId);
  const cards = document.querySelectorAll('#list .entry-card');
  if(cards.length === 0){ alert('내보낼 기록이 없습니다.'); return; }
  const btn = document.getElementById('exportPdfBtn');
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '만드는 중...';
  document.body.classList.add('exporting');
  try{
    const { jsPDF } = window.jspdf;
    let doc = null;
    for(let i = 0; i < cards.length; i++){
      const canvas = await html2canvas(cards[i], { useCORS: true, scale: 2, backgroundColor: '#f2ead9' });
      const imgData = canvas.toDataURL('image/jpeg', 0.85);
      if(!doc){
        doc = new jsPDF({ unit: 'px', format: [canvas.width, canvas.height] });
      } else {
        doc.addPage([canvas.width, canvas.height]);
      }
      doc.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
    }
    doc.save(`${(cat && cat.name) || '여행기록'}_추억.pdf`);
  }catch(err){
    alert('내보내기 실패: ' + err.message);
  }finally{
    document.body.classList.remove('exporting');
    btn.disabled = false; btn.textContent = orig;
  }
}

function entryCardHTML(entry){
  const archived = isArchived(entry);
  const dateStr = new Date(entry.createdAt).toLocaleDateString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'});
  const photos = entry.photos || [];
  return `
  <div class="entry-card ${archived?'archived':''}">
    ${archived ? '<div class="stamp-badge">ARCHIVED</div>' : ''}
    ${photos.length ? `<div class="photo-gallery">${photos.map(p => `<img class="gallery-img" src="${p}" onclick="openLightbox('${p}')">`).join('')}</div>` : ''}
    <div class="entry-title">${escapeHtml(entry.title)}</div>
    <div class="entry-date">${dateStr}</div>
    ${entry.mapLink ? `<a class="entry-map" href="${escapeAttr(entry.mapLink)}" target="_blank">📍 구글맵에서 보기</a>` : ''}
    ${entry.food ? `<div class="entry-food"><b>먹은 음식</b><br>${escapeHtml(entry.food).replace(/\\n/g,'<br>')}</div>` : ''}
    ${entry.note ? `<div class="entry-note">${escapeHtml(entry.note)}</div>` : ''}

async function handleWishlistPhotoFile(e){
  const file = e.target.files[0];
  if(!file) return;
  wlManualPhotoFile = file;
  wlAutoPhotoDataUrl = null;
  const preview = document.getElementById('wlPhotoPreview');
  const dataUrl = await compressForPreview(file);
  preview.innerHTML = `<img src="${dataUrl}" style="width:70px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--line);">`;

async function handleWishlistAutoFill(){
  const btn = document.getElementById('autoFillBtn');
  const mapVal = document.getElementById('wlMap').value.trim();
  const titleVal = document.getElementById('wlTitle').value.trim();
  const query = mapVal || titleVal;
  if(!query){ alert('장소명 또는 위치 검색어를 먼저 입력해주세요.'); return; }
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '검색 중...';
  try{
    const res = await fetch('/api/place?query=' + encodeURIComponent(query));
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '자동 채우기에 실패했습니다.');
    document.getElementById('wlTitle').value = data.name || titleVal;
    document.getElementById('wlNote').value = data.description || '';
    wlAutoMapLink = data.mapLink || null;
    if(data.photoDataUrl){
      wlAutoPhotoDataUrl = data.photoDataUrl;
      wlManualPhotoFile = null;
      document.getElementById('wlPhotoPreview').innerHTML = `<img src="${data.photoDataUrl}" style="width:70px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--line);">`;
    }
  }catch(err){
    alert('자동 채우기 실패: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = orig;
  }
}

async function handleWishlistSingleAdd(e){
  e.preventDefault();
  const title = document.getElementById('wlTitle').value.trim();
  if(!title) return;
  const mapVal = document.getElementById('wlMap').value.trim();
  const note = document.getElementById('wlNote').value.trim();
  const id = 'w' + Date.now();
  const btn = e.target.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try{
    let photo = null;
    if(wlManualPhotoFile){
      const blob = await compressForUpload(wlManualPhotoFile);
      photo = await uploadPhotoBlob(blob, id);
    } else if(wlAutoPhotoDataUrl){
      const blob = dataUrlToBlob(wlAutoPhotoDataUrl);
      photo = await uploadPhotoBlob(blob, id);
    }
    const map_link = wlAutoMapLink || buildMapLink(mapVal || title);
    const { error } = await sb.from('wishlist').insert([{ id, trip_category_id: state.selectedCategoryId, title, map_link, photo, note }]);
    if(error) throw error;
    wlAutoMapLink = null; wlAutoPhotoDataUrl = null; wlManualPhotoFile = null;
    await reloadWishlist();
  }catch(err){
    alert('저장 실패: ' + err.message);
    btn.disabled = false; btn.textContent = '저장하기';
  }
}

async function handleWishlistBulkAdd(e){
  e.preventDefault();
  const raw = document.getElementById('wlBulkText').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if(lines.length === 0) return;
  const rows = lines.map((line, i) => {
    const parts = line.split('|').map(p => p.trim());
    const title = parts[0] || '';
    const note = parts[1] || '';
    const search = parts[2] || '';
    const photo = parts[3] || null;
    return {
      id: 'w' + Date.now() + '_' + i,
      trip_category_id: state.selectedCategoryId, title, note, photo,
      map_link: buildMapLink(search || title)
    };
  }).filter(r => r.title);
  if(rows.length === 0){ alert('올바른 형식이 없습니다. "장소명 | 특징 | 검색어(선택) | 이미지URL(선택)" 형식으로 입력해주세요.'); return; }
  const btn = e.target.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = '등록 중...';
  try{
    const { error } = await sb.from('wishlist').insert(rows);
    if(error) throw error;
    e.target.reset();
    await reloadWishlist();
  }catch(err){
    alert('등록 실패: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = '일괄 등록';
  }
}

function renderWishlistList(){
  if(state.wishlist.length === 0) return `<div class="empty">아직 위시리스트가 없습니다.</div>`;
  return state.wishlist.map(wishlistCardHTML).join('');
}

function wishlistCardHTML(item){
  return `<div class="wish-card">
    ${item.photo ? `<img class="wish-photo" src="${escapeAttr(item.photo)}" onclick="openLightbox('${escapeAttr(item.photo)}')" onerror="this.style.display='none'">` : ''}
    <div class="wish-body">
      <div class="wish-title">${escapeHtml(item.title)}</div>
      ${item.note ? `<div class="wish-note">${escapeHtml(item.note)}</div>` : ''}
      ${item.map_link ? `<a class="entry-map" href="${escapeAttr(item.map_link)}" target="_blank">📍 구글맵에서 보기</a>` : ''}
      <div class="card-actions"><button class="danger" onclick="deleteWishlistItem('${item.id}')">삭제</button></div>
    </div>
  </div>`;
}

async function deleteWishlistItem(id){
  if(!confirm('삭제할까요? 되돌릴 수 없습니다.')) return;
  try{
    const { error } = await sb.from('wishlist').delete().eq('id', id);
    if(error) throw error;
    state.wishlist = state.wishlist.filter(w => w.id !== id);
    renderActiveTab();
  }catch(err){ alert('삭제 실패: ' + err.message); }
}

/* ===== 4. 경비 탭 ===== */

function renderExpensesTab(){
  const total = state.expenses.reduce((s,x) => s + Number(x.krw_amount), 0);
  document.getElementById('tabContent').innerHTML = `
    <div class="expense-total"><span>총 합계</span><span class="amt">${total.toLocaleString()}원</span></div>
    ${expenseFormHTML()}
    <button type="button" class="manage-toggle" id="manageItemsToggle">${state.expenseItemsManageOpen ? '항목 관리 닫기' : '⚙ 항목 관리'}</button>
    ${state.expenseItemsManageOpen ? expenseItemsManageHTML() : ''}
    <div id="list">${renderExpensesList()}</div>
  `;
  document.getElementById('expenseForm').addEventListener('submit', handleExpenseAdd);
  document.getElementById('expCurrency').addEventListener('input', updateExpenseRateVisibility);
  updateExpenseRateVisibility();
  document.getElementById('expItemSelect').addEventListener('change', handleExpenseItemSelectChange);
  document.getElementById('manageItemsToggle').onclick = () => { state.expenseItemsManageOpen = !state.expenseItemsManageOpen; renderActiveTab(); };
  if(state.expenseItemsManageOpen){
    document.querySelectorAll('.ei-rename').forEach(btn => btn.onclick = () => renameExpenseItem(btn.dataset.id));
    document.querySelectorAll('.ei-delete').forEach(btn => btn.onclick = () => deleteExpenseItem(btn.dataset.id));
    document.getElementById('addExpenseItemBtn').onclick = handleAddExpenseItemFromManage;
  }
}

function defaultCurrency(){
  const cat = state.tripCategories.find(c => c.id === state.selectedCategoryId);
  return (cat && cat.default_currency) || 'KRW';
}

function expenseFormHTML(){
  return `
  <form class="add-form" id="expenseForm">
    <h3>+ 경비 추가</h3>
    <label>날짜</label>
    <input type="date" id="expDate" required value="${escapeAttr(state.lastExpenseDate || todayStr())}">
    <label>항목</label>
    <select id="expItemSelect" required>
      <option value="">선택하세요</option>
      ${state.expenseItems.map(i => `<option value="${escapeAttr(i.id)}">${escapeHtml(i.name)}</option>`).join('')}
      <option value="__new__">+ 새 항목 추가</option>
    </select>
    <label>상세 메모</label>
    <input type="text" id="expNote" placeholder="예: 동물원 입장료">
    <label>통화</label>
    <input type="text" id="expCurrency" list="currencyList" value="${escapeAttr(defaultCurrency())}" placeholder="KRW">
    <datalist id="currencyList">
      <option value="KRW"><option value="USD"><option value="JPY"><option value="EUR"><option value="CNY"><option value="TWD"><option value="THB">
    </datalist>
    <div id="expRateRow">
      <label>환율 (외화 1단위당 원화)</label>
      <input type="text" id="expRate" inputmode="decimal" placeholder="예: 1350">
    </div>
    <label>금액</label>
    <input type="text" id="expAmount" inputmode="decimal" required placeholder="예: 50000">
    <button type="submit" class="submit-btn">저장하기</button>
  </form>`;
}

function expenseItemsManageHTML(){
  const list = state.expenseItems.length === 0
    ? `<div class="empty">아직 등록된 항목이 없습니다.</div>`
    : state.expenseItems.map(i => `
      <div class="ei-row">
        <div><b>${escapeHtml(i.name)}</b>${i.description ? `<span class="ei-desc">${escapeHtml(i.description)}</span>` : ''}</div>
        <div class="ei-actions">
          <button type="button" class="ei-rename" data-id="${escapeAttr(i.id)}">수정</button>
          <button type="button" class="ei-delete" data-id="${escapeAttr(i.id)}">삭제</button>
        </div>
      </div>
    `).join('');
  return `<div class="ei-manage">
    ${list}
    <button type="button" class="submit-btn" id="addExpenseItemBtn" style="margin-top:${state.expenseItems.length === 0 ? '0' : '12px'};">+ 새 항목 추가</button>
  </div>`;
}

function updateExpenseRateVisibility(){
  const cur = document.getElementById('expCurrency').value.trim().toUpperCase();
  const rateRow = document.getElementById('expRateRow');
  if(!rateRow) return;
  rateRow.style.display = (cur === 'KRW' || cur === '') ? 'none' : '';
}

async function createExpenseItemPrompt(){
  const name = prompt('새 항목 이름을 입력하세요 (예: 액티비티1)');
  if(!name || !name.trim()) return null;
  const description = (prompt('설명 (선택, 비워도 됩니다)') || '').trim();
  const row = { id: 'ei' + Date.now(), trip_category_id: state.selectedCategoryId, name: name.trim(), description: description || null };
  const { error } = await sb.from('expense_items').insert([row]);
  if(error) throw error;
  return row;
}

async function handleExpenseItemSelectChange(e){
  if(e.target.value !== '__new__') return;
  try{
    const row = await createExpenseItemPrompt();
    if(!row){ e.target.value = ''; return; }
    state.expenseItems.push(row);
    const sel = document.getElementById('expItemSelect');
    const opt = document.createElement('option');
    opt.value = row.id; opt.textContent = row.name;
    sel.insertBefore(opt, sel.lastElementChild);
    sel.value = row.id;
  }catch(err){
    alert('항목 추가 실패: ' + err.message);
    e.target.value = '';
  }
}

async function handleAddExpenseItemFromManage(){
  try{
    const row = await createExpenseItemPrompt();
    if(!row) return;
    await reloadExpenseItems();
  }catch(err){ alert('항목 추가 실패: ' + err.message); }
}

async function renameExpenseItem(id){
  const item = state.expenseItems.find(i => i.id === id);
  if(!item) return;
  const name = prompt('항목 이름', item.name);
  if(!name || !name.trim()) return;
  const description = prompt('설명 (선택)', item.description || '') || '';
  try{
    const { error } = await sb.from('expense_items').update({ name: name.trim(), description: description.trim() || null }).eq('id', id);
    if(error) throw error;
    await reloadExpenseItems();
  }catch(err){ alert('수정 실패: ' + err.message); }
}

async function deleteExpenseItem(id){
  if(!confirm('이 항목을 삭제할까요? 이 항목을 사용 중인 경비 내역이 있으면 삭제되지 않습니다.')) return;
  try{
    const { error } = await sb.from('expense_items').delete().eq('id', id);
    if(error) throw error;
    await reloadExpenseItems();
  }catch(err){
    if(err.code === '23503'){ alert('이 항목을 사용 중인 경비 내역이 있어 삭제할 수 없습니다.'); }
    else { alert('삭제 실패: ' + err.message); }
  }
}

async function handleExpenseAdd(e){
  e.preventDefault();
  const date = document.getElementById('expDate').value;
  if(!date){ alert('날짜를 선택해주세요.'); return; }
  const itemId = document.getElementById('expItemSelect').value;
  if(!itemId || itemId === '__new__'){ alert('항목을 선택해주세요.'); return; }
  const note = document.getElementById('expNote').value.trim();
  const currency = document.getElementById('expCurrency').value.trim().toUpperCase() || 'KRW';
  const amount = parseFloat(document.getElementById('expAmount').value);
  if(isNaN(amount)){ alert('금액을 입력해주세요.'); return; }
  let rate = 1;
  if(currency !== 'KRW'){
    rate = parseFloat(document.getElementById('expRate').value);
    if(isNaN(rate) || rate <= 0){ alert('환율을 입력해주세요.'); return; }
  }
  const krw_amount = Math.round(amount * rate);
  const id = 'x' + Date.now();
  const btn = e.target.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try{
    const { error } = await sb.from('expenses').insert([{
      id, trip_category_id: state.selectedCategoryId, date, item: itemId, note,
      currency, amount, rate, krw_amount
    }]);
    if(error) throw error;
    state.lastExpenseDate = date;
    await reloadExpenses();
  }catch(err){
    alert('저장 실패: ' + err.message);
    btn.disabled = false; btn.textContent = '저장하기';
  }
}

function renderExpensesList(){
  if(state.expenses.length === 0) return `<div class="empty">아직 경비 기록이 없습니다.</div>`;
  return state.expenses.map(expenseRowHTML).join('');
}

function expenseRowHTML(x){
  const itemName = (state.expenseItems.find(i => i.id === x.item) || {}).name || '(삭제된 항목)';
  const amtText = x.currency === 'KRW'
    ? `${Number(x.amount).toLocaleString()}원`
    : `${Number(x.amount).toLocaleString()} ${escapeHtml(x.currency)} (약 ${Number(x.krw_amount).toLocaleString()}원)`;
  const dateStr = x.date ? new Date(x.date + 'T00:00:00').toLocaleDateString('ko-KR', {month:'2-digit', day:'2-digit'}) : '';
  return `<div class="expense-row">
    <div class="expense-main">
      <span class="expense-date">${dateStr}</span>
      <span class="name">${escapeHtml(itemName)}</span>
      ${x.note ? `<span class="expense-note">${escapeHtml(x.note)}</span>` : ''}
    </div>
    <span class="amt">${amtText}</span>
    <button class="small-del" onclick="deleteExpense('${x.id}')">삭제</button>
  </div>`;
}

async function deleteExpense(id){
  if(!confirm('삭제할까요? 되돌릴 수 없습니다.')) return;
  try{
    const { error } = await sb.from('expenses').delete().eq('id', id);
    if(error) throw error;
    state.expenses = state.expenses.filter(x => x.id !== id);
    renderActiveTab();
  }catch(err){ alert('삭제 실패: ' + err.message); }
}

/* ===== 5. 준비물 탭 ===== */

function renderChecklistTab(){
  const total = state.checklist.length;
  const checkedCount = state.checklist.filter(c => c.checked).length;
  const remaining = total - checkedCount;
  const pct = total === 0 ? 0 : Math.round(checkedCount / total * 100);
  document.getElementById('tabContent').innerHTML = `
    <div class="remain-bar">
      <div class="remain-info">
        <span>${checkedCount}/${total} 완료 (${pct}%) <span class="dim">· ${remaining}개 남음</span></span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      </div>
      <button type="button" class="pill ${state.checklistRemainingOnly?'active':''}" id="remainToggle">남은 것만 보기</button>
    </div>
    ${checklistFormHTML()}
    <div id="list">${renderChecklistList()}</div>
  `;
  document.getElementById('checklistForm').addEventListener('submit', handleChecklistAdd);
  const ownerDl = document.getElementById('ownerList');
  if(ownerDl) ownerDl.innerHTML = uniqueOwners().map(o => `<option value="${escapeAttr(o)}">`).join('');
  document.getElementById('remainToggle').onclick = () => { state.checklistRemainingOnly = !state.checklistRemainingOnly; renderActiveTab(); };
}

function checklistFormHTML(){
  return `
  <form class="add-form" id="checklistForm">
    <h3>+ 준비물 추가</h3>
    <label>담당(챙기는 사람)</label>
    <input type="text" id="ckOwner" list="ownerList" required placeholder="예: 공동, 아빠, 엄마">
    <datalist id="ownerList"></datalist>
    <label>준비물</label>
    <input type="text" id="ckText" required placeholder="예: 여권, 충전기">
    <button type="submit" class="submit-btn">추가하기</button>
  </form>`;
}

function uniqueOwners(){
  const seen = ['공동'];
  state.checklist.forEach(c => { if(!seen.includes(c.owner)) seen.push(c.owner); });
  return seen;
}

async function handleChecklistAdd(e){
  e.preventDefault();
  const owner = document.getElementById('ckOwner').value.trim();
  if(!owner){ alert('담당(챙기는 사람)을 입력해주세요.'); return; }
  const text = document.getElementById('ckText').value.trim();
  if(!text) return;
  const id = 'c' + Date.now();
  try{
    const { error } = await sb.from('checklist_items').insert([{ id, trip_category_id: state.selectedCategoryId, owner, text, checked:false }]);
    if(error) throw error;
    await reloadChecklist();
  }catch(err){ alert('저장 실패: ' + err.message); }
}

async function toggleChecklistItem(id, checked){
  try{
    const { error } = await sb.from('checklist_items').update({ checked }).eq('id', id);
    if(error) throw error;
    const item = state.checklist.find(c => c.id === id);
    if(item) item.checked = checked;
    renderActiveTab();
  }catch(err){ alert('업데이트 실패: ' + err.message); }
}

async function deleteChecklistItem(id){
  if(!confirm('삭제할까요?')) return;
  try{
    const { error } = await sb.from('checklist_items').delete().eq('id', id);
    if(error) throw error;
    state.checklist = state.checklist.filter(c => c.id !== id);
    renderActiveTab();
  }catch(err){ alert('삭제 실패: ' + err.message); }
}

function renderChecklistList(){
  const filtered = state.checklistRemainingOnly ? state.checklist.filter(c => !c.checked) : state.checklist;
  if(filtered.length === 0) return `<div class="empty">${state.checklistRemainingOnly ? '남은 준비물이 없습니다. 🎉' : '아직 준비물이 없습니다.'}</div>`;
  return groupBy(filtered, 'owner').map(([owner, items]) => `
    <div class="owner-header"><span class="owner-dot" style="background:${ownerColor(owner)};"></span>${escapeHtml(owner)}</div>
    ${items.map(checklistRowHTML).join('')}
  `).join('');
}

function checklistRowHTML(item){
  return `<div class="check-row ${item.checked?'checked':''}" style="border-left-color:${ownerColor(item.owner)};">
    <input type="checkbox" ${item.checked?'checked':''} onchange="toggleChecklistItem('${item.id}', this.checked)">
    <span class="txt">${escapeHtml(item.text)}</span>
    <button class="small-del" onclick="deleteChecklistItem('${item.id}')">삭제</button>
  </div>`;
}

/* ===== 시작 ===== */

if(state.unlocked){ loadTripCategories(); } else { render(); }
</script>
</body>
</html>
