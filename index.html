/* ===== 공통 유틸 ===== */

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function escapeAttr(s){ return (s==null?'':s).replace(/"/g,'&quot;'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function sanitizeFilename(s){ return (s || '여행기록').replace(/[\\/:*?"<>|]/g, '_'); }

function groupBy(list, key){
  const groups = [];
  list.forEach(item => {
    let g = groups.find(g => g[0] === item[key]);
    if(!g){ g = [item[key], []]; groups.push(g); }
    g[1].push(item);
  });
  return groups;
}

function buildMapLink(text){
  if(/^https?:\/\//i.test(text)) return text;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(text);
}

}

/* ===== 사진 압축/업로드 공통 ===== */

function compressForPreview(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 300;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function compressForUpload(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1400;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.75);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const binary = atob(base64);
  const array = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) array[i] = binary.charCodeAt(i);
  return new Blob([array], { type: mime });
}

async function uploadPhotoBlob(blob, idPrefix){
  const path = `${idPrefix}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: blob.type || 'image/jpeg' });
  if(error) throw error;
  const { data } = sb.storage.from('photos').getPublicUrl(path);
  return data.publicUrl;
}

async function loadTripCategories(){
  try{
    const { data, error } = await sb.from('trip_categories').select('*').order('sort_order', { ascending:true }).order('created_at', { ascending:true });

}

async function loadCategoryData(){
  const id = state.selectedCategoryId;

    const [e, w, x, c, ei, co] = await Promise.all([
      sb.from('entries').select('*').eq('trip_category_id', id).order('created_at', { ascending:false }),
      sb.from('wishlist').select('*').eq('trip_category_id', id).order('created_at', { ascending:false }),

      sb.from('checklist_items').select('*').eq('trip_category_id', id).order('created_at', { ascending:true }),
      sb.from('expense_items').select('*').eq('trip_category_id', id).order('created_at', { ascending:true }),
      sb.from('checklist_owners').select('*').eq('trip_category_id', id).order('created_at', { ascending:true })
    ]);
    if(e.error) throw e.error;
    if(w.error) throw w.error;
    if(x.error) throw x.error;
    if(c.error) throw c.error;
    if(ei.error) throw ei.error;
    if(co.error) throw co.error;
    state.entries = e.data.map(d => ({...d, createdAt: d.created_at, mapLink: d.map_link}));
    state.wishlist = w.data;
    state.expenses = x.data;
    state.checklist = c.data;
    state.expenseItems = ei.data;
    state.checklistOwners = co.data;
    state.activeTab = TAB_LIST[0].key;
    state.expensesView = 'card';
    state.expenseFilter = { dateFrom: '', dateTo: '', itemId: '', currency: '' };

    state.checklistRemainingOnly = false;
    selectedCkOwnerId = null;
    render();
  }catch(err){ alert('불러오기 실패: ' + err.message); }
}

/* ===== 추억 내보내기 (PDF / 이미지, 원본 사진 사용) ===== */

function loadImageElement(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('사진을 불러오지 못했습니다.'));
    img.src = url;
  });
}

function wrapCanvasText(ctx, text, maxWidth){
  const lines = [];
  let current = '';
  for(const ch of text){
    const test = current + ch;
    if(ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = ch;
    } else {
      current = test;
    }
  }
  if(current) lines.push(current);
  return lines;
}

function buildEntryHeaderCanvas(entry, width, scale){
  scale = scale || 1;
  const pad = 20 * scale;
  const dateStr = new Date(entry.createdAt).toLocaleDateString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'});
  const wrapWidth = width - pad * 2;

  const measureCtx = document.createElement('canvas').getContext('2d');
  measureCtx.font = `${15*scale}px sans-serif`;
  const foodLines = entry.food ? wrapCanvasText(measureCtx, '먹은 음식: ' + entry.food, wrapWidth) : [];
  const noteLines = entry.note ? wrapCanvasText(measureCtx, '메모: ' + entry.note, wrapWidth) : [];

  const titleGap = 34 * scale;
  const dateGap = 24 * scale;
  const bodyGap = 22 * scale;
  const height = pad + titleGap + dateGap + (foodLines.length + noteLines.length) * bodyGap + pad;

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f2ead9';
  ctx.fillRect(0, 0, width, height);

  let y = pad + 24 * scale;
  ctx.fillStyle = '#26313a';
  ctx.font = `bold ${24*scale}px sans-serif`;
  ctx.fillText(entry.title, pad, y);
  y += dateGap;

  ctx.font = `${13*scale}px sans-serif`;
  ctx.fillStyle = '#5c6f5a';
  ctx.fillText(dateStr, pad, y);
  y += bodyGap;

  ctx.font = `${15*scale}px sans-serif`;
  ctx.fillStyle = '#3c4750';
  [...foodLines, ...noteLines].forEach(line => {
    ctx.fillText(line, pad, y);
    y += bodyGap;
  });

  return canvas;
}

async function buildEntriesPDF(entries, filenameBase){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 30;
  const maxW = pageW - margin * 2;
  let first = true;

  for(const entry of entries){
    if(!first) doc.addPage();
    first = false;
    let y = margin;

    const headerCanvas = buildEntryHeaderCanvas(entry, maxW, 2);
    const headerH = headerCanvas.height * (maxW / headerCanvas.width);
    doc.addImage(headerCanvas.toDataURL('image/png'), 'PNG', margin, y, maxW, headerH);
    y += headerH + 14;

    for(const url of (entry.photos || [])){
      try{
        const img = await loadImageElement(url);
        const ratio = Math.min(1, maxW / img.naturalWidth);
        const w = img.naturalWidth * ratio;
        const h = img.naturalHeight * ratio;
        if(y + h > pageH - margin){
          doc.addPage();
          y = margin;
        }
        doc.addImage(img, 'JPEG', margin, y, w, h);
        y += h + 14;
      }catch(err){ /* 깨진 사진은 건너뛰고 계속 진행 */ }
    }
  }

  doc.save(`${sanitizeFilename(filenameBase)}.pdf`);
}

async function buildEntriesImage(entries, filenameBase){
  const width = 1000;
  const pad = 20;
  const blocks = [];
  for(const entry of entries){
    const header = buildEntryHeaderCanvas(entry, width);
    const photos = [];
    for(const url of (entry.photos || [])){
      try{ photos.push(await loadImageElement(url)); }catch(err){ /* 깨진 사진은 건너뜀 */ }
    }
    blocks.push({ header, photos });
  }

  let totalHeight = pad;
  const photoLayouts = blocks.map(b => {
    totalHeight += b.header.height + 14;
    const layout = b.photos.map(img => {
      const ratio = Math.min(1, (width - pad*2) / img.naturalWidth);
      const w = img.naturalWidth * ratio, h = img.naturalHeight * ratio;
      totalHeight += h + 14;
      return { img, w, h };
    });
    totalHeight += 30;
    return layout;
  });

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = Math.max(totalHeight, 300);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f2ead9';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let y = pad;
  blocks.forEach((b, i) => {
    ctx.drawImage(b.header, 0, y);
    y += b.header.height + 14;
    photoLayouts[i].forEach(p => {
      ctx.drawImage(p.img, pad, y, p.w, p.h);
      y += p.h + 14;
    });
    y += 30;
  });

  const dataUrl = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `${sanitizeFilename(filenameBase)}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function exportEntries(entries, filenameBase, format, btn){

async function handleWishlistPhotoFile(e){

  const preview = document.getElementById('wlPhotoPreview');

async function handleWishlistAutoFill(){
  const btn = document.getElementById('autoFillBtn');
  const mapVal = document.getElementById('wlMap').value.trim();
  const titleVal = document.getElementById('wlTitle').value.trim();
  const query = mapVal || titleVal;
  if(!query){ alert('장소명 또는 위치 검색어를 먼저 입력해주세요.'); return; }
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '검색 중...';
  try{
    const res = await fetch('/api/place?query=' + encodeURIComponent(query));
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || '자동 채우기에 실패했습니다.');
    document.getElementById('wlTitle').value = data.name || titleVal;
    document.getElementById('wlNote').value = data.description || '';
    wlAutoMapLink = data.mapLink || null;
    if(data.photoDataUrl){
      wlAutoPhotoDataUrl = data.photoDataUrl;
      wlManualPhotoFile = null;
      document.getElementById('wlPhotoPreview').innerHTML = `<img src="${data.photoDataUrl}" style="width:70px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--line);">`;
    }
  }catch(err){
    alert('자동 채우기 실패: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = orig;
  }
}

async function handleWishlistSingleAdd(e){
  e.preventDefault();
  const title = document.getElementById('wlTitle').value.trim();
  if(!title) return;
  const mapVal = document.getElementById('wlMap').value.trim();
  const note = document.getElementById('wlNote').value.trim();
  const id = 'w' + Date.now();
  const btn = e.target.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try{
    let photo = null;
    if(wlManualPhotoFile){
      const blob = await compressForUpload(wlManualPhotoFile);
      photo = await uploadPhotoBlob(blob, id);
    } else if(wlAutoPhotoDataUrl){
      const blob = dataUrlToBlob(wlAutoPhotoDataUrl);
      photo = await uploadPhotoBlob(blob, id);
    }
    const map_link = wlAutoMapLink || buildMapLink(mapVal || title);
    const { error } = await sb.from('wishlist').insert([{ id, trip_category_id: state.selectedCategoryId, title, map_link, photo, note }]);
    if(error) throw error;
    wlAutoMapLink = null; wlAutoPhotoDataUrl = null; wlManualPhotoFile = null;
    await reloadWishlist();
  }catch(err){
    alert('저장 실패: ' + err.message);
    btn.disabled = false; btn.textContent = '저장하기';
  }
}

async function handleWishlistBulkAdd(e){
  e.preventDefault();
  const raw = document.getElementById('wlBulkText').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if(lines.length === 0) return;
  const rows = lines.map((line, i) => {
    const parts = line.split('|').map(p => p.trim());
    const title = parts[0] || '';
    const note = parts[1] || '';
    const search = parts[2] || '';
    const photo = parts[3] || null;
    return {
      id: 'w' + Date.now() + '_' + i,
      trip_category_id: state.selectedCategoryId, title, note, photo,
      map_link: buildMapLink(search || title)
    };
  }).filter(r => r.title);
  if(rows.length === 0){ alert('올바른 형식이 없습니다. "장소명 | 특징 | 검색어(선택) | 이미지URL(선택)" 형식으로 입력해주세요.'); return; }
  const btn = e.target.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = '등록 중...';
  try{
    const { error } = await sb.from('wishlist').insert(rows);
    if(error) throw error;
    e.target.reset();
    await reloadWishlist();
  }catch(err){
    alert('등록 실패: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = '일괄 등록';
  }
}

function itemNameOf(id){
  return (state.expenseItems.find(i => i.id === id) || {}).name || '(삭제된 항목)';
}

function uniqueCurrencies(){
  const seen = [];
  state.expenses.forEach(x => { if(!seen.includes(x.currency)) seen.push(x.currency); });
  return seen;
}

function filteredExpenses(){
  let list = state.expenses.slice();
  const f = state.expenseFilter;
  if(f.dateFrom) list = list.filter(x => x.date && x.date >= f.dateFrom);
  if(f.dateTo) list = list.filter(x => x.date && x.date <= f.dateTo);
  if(f.itemId) list = list.filter(x => x.item === f.itemId);
  if(f.currency) list = list.filter(x => x.currency === f.currency);

  const { key, dir } = state.expenseSort;
  list.sort((a, b) => {
    let av, bv;
    if(key === 'item'){ av = itemNameOf(a.item); bv = itemNameOf(b.item); }
    else { av = a[key]; bv = b[key]; }
    if(av == null) av = '';
    if(bv == null) bv = '';
    if(av < bv) return dir === 'asc' ? -1 : 1;
    if(av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
  return list;
}

function exportExpensesCSV(){
  const rows = filteredExpenses();
  if(rows.length === 0){ alert('내보낼 경비 내역이 없습니다.'); return; }
  const header = ['날짜','항목명','통화','금액','환율','원화환산액','상세설명'];
  const lines = [header.join(',')];
  rows.forEach(x => {
    const cells = [x.date || '', itemNameOf(x.item), x.currency, x.amount, x.rate, x.krw_amount, x.note || ''];
    lines.push(cells.map(csvEscape).join(','));
  });
  const csv = '﻿' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${sanitizeFilename(categoryFileName())}_경비.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
}

function csvEscape(v){
  const s = String(v == null ? '' : v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

  if(!date){ alert('날짜를 선택해주세요.'); return; }
  const itemId = document.getElementById('expItemSelect').value;
  if(!itemId || itemId === '__new__'){ alert('항목을 선택해주세요.'); return; }
  const note = document.getElementById('expNote').value.trim();
  const currency = document.getElementById('expCurrency').value.trim().toUpperCase() || 'KRW';
  const amount = parseFloat(document.getElementById('expAmount').value);
  if(isNaN(amount)){ alert('금액을 입력해주세요.'); return; }
  let rate = 1;
  if(currency !== 'KRW'){
    rate = parseFloat(document.getElementById('expRate').value);
    if(isNaN(rate) || rate <= 0){ alert('환율을 입력해주세요.'); return; }
  }
  const krw_amount = Math.round(amount * rate);
  const id = 'x' + Date.now();
  const btn = e.target.querySelector('.submit-btn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try{
    const { error } = await sb.from('expenses').insert([{
      id, trip_category_id: state.selectedCategoryId, date, item: itemId, note,
      currency, amount, rate, krw_amount
    }]);
    if(error) throw error;
    state.lastExpenseDate = date;
    await reloadExpenses();
  }catch(err){
    alert('저장 실패: ' + err.message);
    btn.disabled = false; btn.textContent = '저장하기';
  }
}

function expenseRowHTML(x){
  const amtText = x.currency === 'KRW'
    ? `${Number(x.amount).toLocaleString()}원`
    : `${Number(x.amount).toLocaleString()} ${escapeHtml(x.currency)} (약 ${Number(x.krw_amount).toLocaleString()}원)`;
  const dateStr = x.date ? new Date(x.date + 'T00:00:00').toLocaleDateString('ko-KR', {month:'2-digit', day:'2-digit'}) : '';
  return `<div class="expense-row">
    <div class="expense-main">
      <span class="expense-date">${dateStr}</span>
      <span class="name">${escapeHtml(itemNameOf(x.item))}</span>
      ${x.note ? `<span class="expense-note">${escapeHtml(x.note)}</span>` : ''}
    </div>
    <span class="amt">${amtText}</span>
    <button class="small-del" onclick="deleteExpense('${x.id}')">삭제</button>
  </div>`;
}

async function deleteExpense(id){
  if(!confirm('삭제할까요? 되돌릴 수 없습니다.')) return;
  try{
    const { error } = await sb.from('expenses').delete().eq('id', id);
    if(error) throw error;
    state.expenses = state.expenses.filter(x => x.id !== id);
    renderActiveTab();
  }catch(err){ alert('삭제 실패: ' + err.message); }
}

/* ===== 5. 준비물 탭 ===== */

function ownerLookup(id){
  return state.checklistOwners.find(o => o.id === id) || { name: '(삭제된 담당자)', color: '#999999' };
}

function renderChecklistTab(){
  const total = state.checklist.length;
  const checkedCount = state.checklist.filter(c => c.checked).length;
  const remaining = total - checkedCount;
  const pct = total === 0 ? 0 : Math.round(checkedCount / total * 100);
  document.getElementById('tabContent').innerHTML = `
    <div class="remain-bar">
      <div class="remain-info">
        <span>${checkedCount}/${total} 완료 (${pct}%) <span class="dim">· ${remaining}개 남음</span></span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      </div>
      <button type="button" class="pill ${state.checklistRemainingOnly?'active':''}" id="remainToggle">남은 것만 보기</button>
    </div>
    ${checklistFormHTML()}
    <button type="button" class="manage-toggle" id="manageOwnersToggle">${state.checklistOwnersManageOpen ? '담당자 관리 닫기' : '⚙ 담당자 관리'}</button>
    ${state.checklistOwnersManageOpen ? checklistOwnersManageHTML() : ''}
    <div id="list">${renderChecklistList()}</div>
  `;
  document.getElementById('checklistForm').addEventListener('submit', handleChecklistAdd);
  document.querySelectorAll('.owner-chip').forEach(btn => {
    btn.onclick = () => {
      selectedCkOwnerId = btn.dataset.id;
      document.querySelectorAll('.owner-chip').forEach(b => b.classList.toggle('active', b === btn));
    };
  });
  document.getElementById('remainToggle').onclick = () => { state.checklistRemainingOnly = !state.checklistRemainingOnly; renderActiveTab(); };
  document.getElementById('manageOwnersToggle').onclick = () => { state.checklistOwnersManageOpen = !state.checklistOwnersManageOpen; renderActiveTab(); };
  if(state.checklistOwnersManageOpen){
    document.querySelectorAll('.owner-rename').forEach(btn => btn.onclick = () => renameChecklistOwner(btn.dataset.id));
    document.querySelectorAll('.owner-delete').forEach(btn => btn.onclick = () => deleteChecklistOwner(btn.dataset.id));
    document.querySelectorAll('.owner-color-input').forEach(input => input.onchange = () => updateChecklistOwnerColor(input.dataset.id, input.value));
    document.getElementById('addOwnerBtn').onclick = handleAddChecklistOwnerFromManage;
  }
}

function checklistFormHTML(){
  const chips = state.checklistOwners.map(o => `
    <button type="button" class="owner-chip ${selectedCkOwnerId === o.id ? 'active' : ''}" data-id="${escapeAttr(o.id)}" style="--chip-color:${escapeAttr(o.color)};">${escapeHtml(o.name)}</button>
  `).join('');
  return `
  <form class="add-form" id="checklistForm">
    <h3>+ 준비물 추가</h3>
    <label>담당(챙기는 사람)</label>
    <div class="owner-chip-row" id="ownerChipRow">
      ${chips || `<span class="dim" style="font-size:12px;">아래 "담당자 관리"에서 먼저 담당자를 추가해주세요.</span>`}
    </div>
    <label>준비물</label>
    <input type="text" id="ckText" required placeholder="예: 여권, 충전기">
    <button type="submit" class="submit-btn">추가하기</button>
  </form>`;
}

function checklistOwnersManageHTML(){
  const list = state.checklistOwners.length === 0
    ? `<div class="empty">아직 등록된 담당자가 없습니다.</div>`
    : state.checklistOwners.map(o => `
      <div class="ei-row">
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="color" class="owner-color-input" data-id="${escapeAttr(o.id)}" value="${escapeAttr(o.color)}">
          <b>${escapeHtml(o.name)}</b>
        </div>
        <div class="ei-actions">
          <button type="button" class="owner-rename" data-id="${escapeAttr(o.id)}">이름변경</button>
          <button type="button" class="owner-delete" data-id="${escapeAttr(o.id)}">삭제</button>
        </div>
      </div>
    `).join('');
  const nextColor = OWNER_COLORS[state.checklistOwners.length % OWNER_COLORS.length];
  return `<div class="ei-manage">
    ${list}
    <div class="inline-row" style="margin-top:12px;">
      <input type="color" id="ownerColorInput" value="${nextColor}" style="width:40px;flex:0 0 auto;padding:2px;">
      <input type="text" id="ownerNameInput" placeholder="담당자 이름 (예: 아빠)">
      <button type="button" class="autofill-btn" id="addOwnerBtn">+ 추가</button>
    </div>
  </div>`;
}

async function handleAddChecklistOwnerFromManage(){
  const nameInput = document.getElementById('ownerNameInput');
  const colorInput = document.getElementById('ownerColorInput');
  const name = nameInput.value.trim();
  if(!name){ alert('담당자 이름을 입력해주세요.'); return; }
  const color = colorInput.value || OWNER_COLORS[state.checklistOwners.length % OWNER_COLORS.length];
  const id = 'co' + Date.now();
  try{
    const { error } = await sb.from('checklist_owners').insert([{ id, trip_category_id: state.selectedCategoryId, name, color }]);
    if(error) throw error;
    await reloadChecklistOwners();
  }catch(err){ alert('담당자 추가 실패: ' + err.message); }
}

async function renameChecklistOwner(id){
  const owner = state.checklistOwners.find(o => o.id === id);
  if(!owner) return;
  const name = prompt('담당자 이름', owner.name);
  if(!name || !name.trim()) return;
  try{
    const { error } = await sb.from('checklist_owners').update({ name: name.trim() }).eq('id', id);
    if(error) throw error;
    await reloadChecklistOwners();
  }catch(err){ alert('수정 실패: ' + err.message); }
}

async function updateChecklistOwnerColor(id, color){
  try{
    const { error } = await sb.from('checklist_owners').update({ color }).eq('id', id);
    if(error) throw error;
    const o = state.checklistOwners.find(o => o.id === id);
    if(o) o.color = color;
    renderActiveTab();
  }catch(err){ alert('색상 변경 실패: ' + err.message); }
}

async function deleteChecklistOwner(id){
  if(!confirm('이 담당자를 삭제할까요? 이 담당자로 지정된 준비물이 있으면 삭제되지 않습니다.')) return;
  try{
    const { error } = await sb.from('checklist_owners').delete().eq('id', id);
    if(error) throw error;
    if(selectedCkOwnerId === id) selectedCkOwnerId = null;
    await reloadChecklistOwners();
  }catch(err){
    if(err.code === '23503'){ alert('이 담당자로 지정된 준비물이 있어 삭제할 수 없습니다.'); }
    else { alert('삭제 실패: ' + err.message); }
  }
}

async function handleChecklistAdd(e){
  e.preventDefault();
  if(!selectedCkOwnerId){ alert('담당(챙기는 사람)을 선택해주세요.'); return; }
  const text = document.getElementById('ckText').value.trim();
  if(!text) return;
  const id = 'c' + Date.now();
  try{
    const { error } = await sb.from('checklist_items').insert([{ id, trip_category_id: state.selectedCategoryId, owner: selectedCkOwnerId, text, checked:false }]);
    if(error) throw error;
    document.getElementById('ckText').value = '';
    await reloadChecklist();
  }catch(err){ alert('저장 실패: ' + err.message); }
}

async function toggleChecklistItem(id, checked){
  try{
    const { error } = await sb.from('checklist_items').update({ checked }).eq('id', id);
    if(error) throw error;
    const item = state.checklist.find(c => c.id === id);
    if(item) item.checked = checked;
    renderActiveTab();
  }catch(err){ alert('업데이트 실패: ' + err.message); }
}

async function deleteChecklistItem(id){
  if(!confirm('삭제할까요?')) return;
  try{
    const { error } = await sb.from('checklist_items').delete().eq('id', id);
    if(error) throw error;
    state.checklist = state.checklist.filter(c => c.id !== id);
    renderActiveTab();
  }catch(err){ alert('삭제 실패: ' + err.message); }
}

function renderChecklistList(){
  const filtered = state.checklistRemainingOnly ? state.checklist.filter(c => !c.checked) : state.checklist;
  if(filtered.length === 0) return `<div class="empty">${state.checklistRemainingOnly ? '남은 준비물이 없습니다. 🎉' : '아직 준비물이 없습니다.'}</div>`;
  return groupBy(filtered, 'owner').map(([ownerId, items]) => {
    const o = ownerLookup(ownerId);
    return `
    <div class="owner-header"><span class="owner-dot" style="background:${o.color};"></span>${escapeHtml(o.name)}</div>
    ${items.map(checklistRowHTML).join('')}`;
  }).join('');
}

function checklistRowHTML(item){
  const o = ownerLookup(item.owner);
  return `<div class="check-row ${item.checked?'checked':''}" style="border-left-color:${o.color};">
    <input type="checkbox" ${item.checked?'checked':''} onchange="toggleChecklistItem('${item.id}', this.checked)">
    <span class="txt">${escapeHtml(item.text)}</span>
    <button class="small-del" onclick="deleteChecklistItem('${item.id}')">삭제</button>
  </div>`;
}

/* ===== 시작 ===== */

if(state.unlocked){ loadTripCategories(); } else { render(); }
</script>
</body>
</html>
